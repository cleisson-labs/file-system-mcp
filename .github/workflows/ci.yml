name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "18 4 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, macos]
    uses: cleisson-labs/.github/.github/workflows/rust.yml@03f53ed9e71b2741c683c448a538f7a7b8aa1786 # v1.0.0
    with:
      platform: ${{ matrix.platform }}
      toolchain: '1.93.1'
      coverage: ${{ matrix.platform == 'linux' }}

  dashboard:
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, macos]
    uses: cleisson-labs/.github/.github/workflows/node.yml@03f53ed9e71b2741c683c448a538f7a7b8aa1786 # v1.0.0
    with:
      platform: ${{ matrix.platform }}
      test-files: tests/observer_ui.test.mjs

  dependencies:
    uses: cleisson-labs/.github/.github/workflows/rust-audit.yml@03f53ed9e71b2741c683c448a538f7a7b8aa1786 # v1.0.0

  publication:
    name: Dashboard lint and private artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint dashboard JavaScript
        run: |
          url='https://github.com/biomejs/biome/releases/download/%40biomejs/biome%402.6.9/biome-linux-x64'
          curl --fail --silent --show-error --location --retry 3 "$url" -o "$RUNNER_TEMP/biome"
          echo "5409e32eb17b47e0d1d9bbf213b749eba1f9c35d8b18fbd2ee55971157918a57  $RUNNER_TEMP/biome" | sha256sum --check
          chmod +x "$RUNNER_TEMP/biome"
          "$RUNNER_TEMP/biome" lint --error-on-warnings observer-ui/*.js tests/observer_ui.test.mjs
          empty=$(git hash-object -t tree /dev/null)
          git -c core.whitespace=trailing-space,space-before-tab,tab-in-indent \
            diff --check "$empty" HEAD -- '*.js' '*.mjs'
      - name: Reject tracked files matching repository ignore rules
        run: |
          ignored=$(git ls-files -ci --exclude-standard)
          if [[ -n "$ignored" ]]; then
            printf 'Remove tracked private artifacts:\n%s\n' "$ignored"
            exit 1
          fi

  security:
    uses: cleisson-labs/.github/.github/workflows/security.yml@03f53ed9e71b2741c683c448a538f7a7b8aa1786 # v1.0.0

  docs:
    uses: cleisson-labs/.github/.github/workflows/docs.yml@03f53ed9e71b2741c683c448a538f7a7b8aa1786 # v1.0.0
    with:
      external: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

  codeql:
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, actions]
    uses: cleisson-labs/.github/.github/workflows/codeql.yml@03f53ed9e71b2741c683c448a538f7a7b8aa1786 # v1.0.0
    with:
      language: ${{ matrix.language }}

  ci-ok:
    if: ${{ always() }}
    needs: [rust, dashboard, dependencies, publication, security, docs, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$RESULTS"
